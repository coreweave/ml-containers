on:
  push:
    paths:
      - "sglang/**"
      - ".github/workflows/sglang.yml"
      - ".github/configurations/sglang.yml"


jobs:
  preflight-tests:
    name: Test SGLang preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Run offline preflight tests
        run: python3 -B -m unittest discover -s sglang -p 'test_*.py' -v
  get-config:
    name: Get sglang config
    uses: ./.github/workflows/read-configuration.yml
    with:
      path: ./.github/configurations/sglang.yml
  build:
    uses: ./.github/workflows/build.yml
    needs: [get-config, preflight-tests]
    strategy:
      matrix: ${{ fromJSON(needs.get-config.outputs.config) }}
    secrets: inherit
    with:
      image-name: sglang
      folder: sglang
      platforms: linux/amd64,linux/arm64
      object-storage-secrets: true
      build-contexts: common=common
      tag-suffix: ${{ matrix.tag }}
      cache-key: ${{ matrix.tag }}
      build-args: |
        BASE_IMAGE=${{ matrix.base-image }}
        SGLANG_COMMIT=${{ matrix.sglang-commit }}
        SGLANG_GLM53_PREFLIGHT=${{ matrix.glm53-preflight || '0' }}
