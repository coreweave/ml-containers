on:
  workflow_dispatch:
  push:
    paths:
      - "bloom/**"
      - ".github/workflows/bloom.yml"


permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      image-name: bloom
      folder: bloom
      build-args: ""
