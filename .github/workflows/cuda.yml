name: cuda

on:
  push:
    paths:
      - "cuda/**"
      - ".github/configurations/cuda.yml"
      - ".github/workflows/cuda.yml"
      - ".github/workflows/cuda-layers.yml"


jobs:
  get-config:
    name: Get cuda Config
    uses: ./.github/workflows/read-configuration.yml
    with:
      path: ./.github/configurations/cuda.yml
  build:
    name: Build cuda
    needs: get-config
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-config.outputs.config) }}
    uses: ./.github/workflows/cuda-layers.yml
    secrets: inherit
    with:
      cuda-version: ${{ matrix.cuda }}
      os: ${{ matrix.os }}
